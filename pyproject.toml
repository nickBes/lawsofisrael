[project]
name = "lawsofisrael"
version = "0.2.0"
description = "Shared extraction, chunking, and LLooM setup for the Israeli passed-laws concept-discovery pipeline."
requires-python = ">=3.12,<3.13"
# The default environment is intentionally limited to collection, preparation,
# and publication. Docling, OCR, and LLM dependencies remain lazy/optional.
dependencies = [
    "datasets==3.2.0",
    "huggingface-hub==0.27.0",
    "jupyter==1.1.1",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "python-dotenv==1.1.1",
    "requests==2.34.2",
    "requests-cache==1.3.3",
    # Pinned to the 0.7.x line because text_lloom (the `lloom` extra) requires
    # tiktoken<0.8.0; only get_encoding("cl100k_base") is used, which is stable.
    "tiktoken==0.7.0",
    "urllib3==2.3.0",
]

[project.optional-dependencies]
# LLM concept-induction stack used by the LLooM notebooks (lawsofisrael.lloom,
# lloom_experiment*.ipynb, concept_pipeline.ipynb). text_lloom is the Stanford
# LLooM package; it transitively pulls umap-learn/hdbscan/openai, but openai is
# declared here too since lawsofisrael.lloom imports it directly.
lloom = ["text_lloom==0.8.2.1", "openai>=1.57.0"]
# Authoritative bill-document extraction. Docling handles PDF and DOCX directly;
# its legacy-DOC support additionally requires the LibreOffice system binary.
extraction = ["docling==2.132.0"]
# v2.1 similarity/clustering diagnostics (lawsofisrael.diagnostics_v2). These
# are imported lazily so the package stays importable without them; matplotlib
# is only needed for the optional condensed-tree / UMAP scatter plots.
diagnostics = ["numpy", "pandas", "umap-learn", "hdbscan"]
plots = ["matplotlib"]

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "lawsofisrael"
version = "0.2.0"
description = "Shared extraction, chunking, and LLooM setup for the Israeli passed-laws concept-discovery pipeline."
requires-python = ">=3.12,<3.13"
# The default environment is intentionally limited to collection, preparation,
# and publication. Docling, OCR, and LLM dependencies remain lazy/optional.
dependencies = [
    "datasets==3.2.0",
    "huggingface-hub==0.27.0",
    "jupyter==1.1.1",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "requests==2.32.3",
    "requests-cache==1.2.1",
    "tiktoken==0.8.0",
    "urllib3==2.3.0",
]

[project.optional-dependencies]
# v2.1 similarity/clustering diagnostics (lawsofisrael.diagnostics_v2). These
# are imported lazily so the package stays importable without them; matplotlib
# is only needed for the optional condensed-tree / UMAP scatter plots.
diagnostics = ["numpy", "pandas", "umap-learn", "hdbscan"]
plots = ["matplotlib"]

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
